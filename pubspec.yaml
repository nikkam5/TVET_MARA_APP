name: tvet_staff_app
description: "TVET MARA staff attendance, reporting and administration app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Also used indirectly by Flutter's platform-adaptive widgets.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.16.0
  firebase_core: ^4.12.1
  geolocator: ^14.0.3
  http: ^1.6.0
  url_launcher: ^6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  pdf: 3.11.3
  printing: 5.14.2

# These compatible versions avoid Flutter 3.44.8's native build-hook issue
# when the Windows SDK path contains spaces.
dependency_overrides:
  path_provider_android: 2.2.22
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mara_logo.png
    - assets/images/tvetmara_logo.png
    # PDF fonts; license retained in assets/fonts/OFL.txt.
    - assets/fonts/OpenSans-Regular.ttf
    - assets/fonts/OpenSans-Bold.ttf
